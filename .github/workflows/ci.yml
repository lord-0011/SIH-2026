name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Check
        run: ruff check .

      - name: Run Black Check
        run: black --check .

      - name: Cache interim data
        uses: actions/cache@v4
        id: cache-interim
        with:
          path: data/interim
          key: interim-data-${{ hashFiles('reports.dvc', 'data/interim.dvc', 'src/ingestion/**') }}
          restore-keys: |
            interim-data-

      - name: Run Multi-Month Ingestion
        if: steps.cache-interim.outputs.cache-hit != 'true'
        run: |
          if compgen -G "reports/*.pdf" > /dev/null; then
            python -m src.ingestion.run
          else
            echo "Raw report PDFs not in git (tracked via DVC); skipping ingestion in clean CI runner"
          fi

      # Exercises parser on committed synthetic fixture (tests/test_ingestion_fixture.py) on every run
      - name: Run Pytest Test Suite
        run: pytest -v

      - name: Validate Docker Compose Config
        run: docker compose config
